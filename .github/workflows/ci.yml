name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets: tests use an in-memory fake of Firebase and a local fake of the Jamendo API.
    # Make sure nothing real is configured by accident.
    env:
      JAMENDO_CLIENT_ID: ""
      FIREBASE_DATABASE_URL: ""
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (server)
        run: npm ci
        working-directory: server

      - name: Install (client)
        run: npm ci
        working-directory: client

      - name: Typecheck (incl. tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
